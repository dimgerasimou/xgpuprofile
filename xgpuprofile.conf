# xgpuprofile configuration.
#
# Changes here are staged into an Xorg config fragment and take effect the
# next time Xorg starts. `xgpuprofile --restart-x` applies one immediately,
# at the cost of ending the current session.

# Which GPU drives the display:
#
#   hybrid   always keep the integrated GPU (normal)
#   auto     let the rule below decide
#   dgpu     always use the discrete GPU
#
# Equivalent commands: `xgpuprofile --mode hybrid|auto|dgpu`.
mode = hybrid

# When `mode = auto`, use the discrete GPU:
#
#   both      on mains AND an external display attached   (default)
#   either    on mains OR an external display attached
#   ac        on mains, whatever is plugged in
#   external  an external display attached, whatever the power
#   always    unconditionally (same as mode = dgpu)
#
# "both" is the conservative choice. The discrete GPU cannot reach its
# deepest idle power state while it drives the display, so this only pays
# that cost when there is a display that actually benefits.
rule = both

# Which display manager unit --restart-x should restart. "auto" resolves it
# at runtime: the display-manager.service alias first, then known units that
# are enabled. Set it explicitly if that guesses wrong.
# display_manager = ly.service
display_manager = auto

# The GPU to hand the display to. "auto" picks the display device the
# firmware did not mark boot_vga, which is the discrete one on a laptop.
# busid = PCI:1:0:0
busid = auto

# Xorg driver name for it. "auto" uses the bound kernel driver.
# driver = nvidia
driver = auto
